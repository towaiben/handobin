<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마인크래프트 지뢰찾기</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      user-select: none;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
    }
    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 1px #000;
    }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 1px #000;
    }
    #crosshair::before {
      left: 7px; top: 3px; width: 2px; height: 10px;
    }
    #crosshair::after {
      left: 3px; top: 7px; width: 10px; height: 2px;
    }
    #stats {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 20px;
      line-height: 1.5;
    }
    #hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 14px;
    }
    #hotbar {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
    }
    .slot {
      width: 44px;
      height: 44px;
      border: 3px solid #373737;
      background: rgba(0, 0, 0, 0.45);
      box-shadow: inset 0 0 0 2px #8b8b8b;
      display: grid;
      place-items: center;
      font-size: 22px;
    }
    .slot.active { border-color: #fff; }
    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      z-index: 5;
    }
    #overlay.hidden { display: none; }
    .panel {
      width: min(520px, calc(100vw - 32px));
      background: #3d3d3d;
      border: 4px solid #1b1b1b;
      box-shadow: inset 0 0 0 3px #8b8b8b;
      padding: 28px 28px 24px;
      text-align: center;
    }
    .panel h1 {
      margin: 0 0 10px;
      font-size: 32px;
      letter-spacing: -0.5px;
    }
    .panel p {
      margin: 0 0 10px;
      line-height: 1.55;
      color: #eee;
    }
    .panel button {
      margin-top: 10px;
      padding: 10px 22px;
      font-size: 18px;
      font-weight: 700;
      border: 3px solid #1b1b1b;
      background: #5a8f3d;
      color: #fff;
      cursor: pointer;
    }
    .panel button:hover { background: #6aa84f; }
    #overlay.pointer-events { pointer-events: auto; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="stats">
      <div>지뢰: <span id="mineCount">0</span></div>
      <div>깃발: <span id="flagCount">0</span></div>
      <div>시간: <span id="timer">0</span>초</div>
    </div>
    <div id="hotbar">
      <div class="slot active" title="곡괭이">⛏️</div>
      <div class="slot" title="깃발">🚩</div>
    </div>
    <div id="hint">WASD 이동 · 마우스 시점 · 스페이스 점프 · 좌클릭 파기 · 우클릭 깃발 · ESC 해제</div>
  </div>
  <div id="overlay">
    <div class="panel">
      <h1 id="overlayTitle">블록 지뢰찾기</h1>
      <p id="overlayText">마인크래프트처럼 평원을 걸어 다니며 잔디 블록을 파세요.<br>숫자만큼 주변에 지뢰(TNT)가 숨어 있습니다.</p>
      <button id="startBtn" type="button">클릭해서 탐험 시작</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script>
  <script>
(function () {
  const SIZE = 12;
  const MINES = 18;
  const BLOCK = 1;
  const EYE = 1.62;
  const SPEED = 6.4;
  const JUMP = 7.2;
  const GRAVITY = 22;

  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayText = document.getElementById("overlayText");
  const startBtn = document.getElementById("startBtn");
  const mineEl = document.getElementById("mineCount");
  const flagEl = document.getElementById("flagCount");
  const timerEl = document.getElementById("timer");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 28, 72);

  const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.08, 200);
  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.body.prepend(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xfff3c8, 0.95);
  sun.position.set(18, 28, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0x9ad0ff, 0x4a7a32, 0.35));

  const texCache = new Map();
  function noiseCanvas(size, paint) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const ctx = c.getContext("2d");
    paint(ctx, size);
    const tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  function pixelNoise(ctx, size, colors) {
    const image = ctx.createImageData(size, size);
    for (let i = 0; i < image.data.length; i += 4) {
      const col = colors[(Math.random() * colors.length) | 0];
      image.data[i] = col[0];
      image.data[i + 1] = col[1];
      image.data[i + 2] = col[2];
      image.data[i + 3] = 255;
    }
    ctx.putImageData(image, 0, 0);
  }

  function grassTop() {
    return noiseCanvas(16, (ctx, s) => {
      pixelNoise(ctx, s, [[74, 168, 48], [91, 186, 55], [62, 148, 40], [82, 176, 50]]);
    });
  }
  function grassSide() {
    return noiseCanvas(16, (ctx, s) => {
      pixelNoise(ctx, s, [[122, 84, 52], [138, 96, 58], [110, 74, 44], [128, 88, 54]]);
      ctx.fillStyle = "#4aa030";
      ctx.fillRect(0, 0, s, 4);
      ctx.fillStyle = "#5bb83c";
      ctx.fillRect(0, 0, s, 2);
    });
  }
  function dirtTex() {
    return noiseCanvas(16, (ctx, s) => {
      pixelNoise(ctx, s, [[122, 84, 52], [138, 96, 58], [110, 74, 44], [96, 64, 38]]);
    });
  }
  function stoneTex() {
    return noiseCanvas(16, (ctx, s) => {
      pixelNoise(ctx, s, [[128, 128, 128], [142, 142, 142], [110, 110, 110], [120, 120, 124]]);
    });
  }
  function woodTex() {
    return noiseCanvas(16, (ctx, s) => {
      pixelNoise(ctx, s, [[110, 78, 42], [96, 66, 34], [124, 88, 48], [88, 58, 30]]);
      ctx.fillStyle = "rgba(60,40,20,0.25)";
      for (let x = 0; x < s; x += 4) ctx.fillRect(x, 0, 1, s);
    });
  }
  function leafTex() {
    return noiseCanvas(16, (ctx, s) => {
      pixelNoise(ctx, s, [[46, 120, 28], [58, 140, 34], [36, 100, 22], [70, 150, 40]]);
    });
  }
  function tntSide() {
    return noiseCanvas(16, (ctx, s) => {
      ctx.fillStyle = "#c43a2b";
      ctx.fillRect(0, 0, s, s);
      ctx.fillStyle = "#e8e8e8";
      ctx.fillRect(0, 5, s, 6);
      ctx.fillStyle = "#222";
      ctx.font = "bold 6px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("TNT", s / 2, s / 2 + 0.5);
    });
  }
  function tntTop() {
    return noiseCanvas(16, (ctx, s) => {
      ctx.fillStyle = "#c43a2b";
      ctx.fillRect(0, 0, s, s);
      ctx.fillStyle = "#8a2418";
      ctx.fillRect(2, 2, 12, 12);
      ctx.fillStyle = "#555";
      ctx.fillRect(7, 3, 2, 6);
      ctx.fillStyle = "#ffd54a";
      ctx.fillRect(7, 2, 2, 2);
    });
  }
  function numberTex(n) {
    const key = "n" + n;
    if (texCache.has(key)) return texCache.get(key);
    const colors = ["#000", "#2020e0", "#2d7a1a", "#c62828", "#1a237e", "#6a1b1a", "#00838f", "#212121", "#424242"];
    const tex = noiseCanvas(16, (ctx, s) => {
      pixelNoise(ctx, s, [[210, 210, 210], [198, 198, 198], [188, 188, 188]]);
      if (n > 0) {
        ctx.fillStyle = colors[n] || "#111";
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(n), s / 2, s / 2 + 1);
      }
    });
    texCache.set(key, tex);
    return tex;
  }
  function flagTex() {
    return noiseCanvas(16, (ctx, s) => {
      ctx.fillStyle = "#8d6e3a";
      ctx.fillRect(3, 2, 2, 13);
      ctx.fillStyle = "#d32f2f";
      ctx.beginPath();
      ctx.moveTo(5, 2);
      ctx.lineTo(14, 6);
      ctx.lineTo(5, 10);
      ctx.fill();
    });
  }

  const mats = {
    grass: [
      new THREE.MeshLambertMaterial({ map: grassSide() }),
      new THREE.MeshLambertMaterial({ map: grassSide() }),
      new THREE.MeshLambertMaterial({ map: grassTop() }),
      new THREE.MeshLambertMaterial({ map: dirtTex() }),
      new THREE.MeshLambertMaterial({ map: grassSide() }),
      new THREE.MeshLambertMaterial({ map: grassSide() })
    ],
    dirt: new THREE.MeshLambertMaterial({ map: dirtTex() }),
    stone: new THREE.MeshLambertMaterial({ map: stoneTex() }),
    wood: new THREE.MeshLambertMaterial({ map: woodTex() }),
    leaf: new THREE.MeshLambertMaterial({ map: leafTex() }),
    tnt: [
      new THREE.MeshLambertMaterial({ map: tntSide() }),
      new THREE.MeshLambertMaterial({ map: tntSide() }),
      new THREE.MeshLambertMaterial({ map: tntTop() }),
      new THREE.MeshLambertMaterial({ map: tntTop() }),
      new THREE.MeshLambertMaterial({ map: tntSide() }),
      new THREE.MeshLambertMaterial({ map: tntSide() })
    ],
    flag: new THREE.MeshLambertMaterial({ map: flagTex(), transparent: true })
  };

  const geo = new THREE.BoxGeometry(BLOCK, BLOCK, BLOCK);
  const thinGeo = new THREE.BoxGeometry(BLOCK, 0.18, BLOCK);

  function addCube(x, y, z, material, opts) {
    const mesh = new THREE.Mesh(geo, material);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    if (opts) Object.assign(mesh, opts);
    scene.add(mesh);
    return mesh;
  }

  const fieldOriginX = -((SIZE - 1) * BLOCK) / 2;
  const fieldOriginZ = -((SIZE - 1) * BLOCK) / 2;

  const ground = new THREE.Mesh(
    new THREE.BoxGeometry(80, 1, 80),
    mats.dirt
  );
  ground.position.set(0, -0.5, 0);
  ground.receiveShadow = true;
  scene.add(ground);

  for (let i = 0; i < 900; i++) {
    const gx = (Math.random() - 0.5) * 76;
    const gz = (Math.random() - 0.5) * 76;
    if (Math.abs(gx) < SIZE / 2 + 3 && Math.abs(gz) < SIZE / 2 + 3) continue;
    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.35 + Math.random() * 0.25, 0.12),
      new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0x4caf50 : 0x388e3c })
    );
    blade.position.set(gx, 0.25, gz);
    scene.add(blade);
  }

  function tree(tx, tz) {
    for (let y = 0; y < 4; y++) addCube(tx, 0.5 + y, tz, mats.wood);
    for (let dx = -2; dx <= 2; dx++) {
      for (let dy = 3; dy <= 6; dy++) {
        for (let dz = -2; dz <= 2; dz++) {
          if (Math.abs(dx) + Math.abs(dz) + (dy === 6 ? 1 : 0) > 3) continue;
          if (dx === 0 && dz === 0 && dy < 5) continue;
          addCube(tx + dx, 0.5 + dy, tz + dz, mats.leaf);
        }
      }
    }
  }
  tree(-14, -10);
  tree(16, -8);
  tree(-12, 14);
  tree(13, 12);
  tree(18, 3);
  tree(-18, 2);

  for (let i = -SIZE / 2 - 1; i <= SIZE / 2 + 1; i++) {
    addCube(i, 0.5, -SIZE / 2 - 1.5, mats.stone);
    addCube(i, 0.5, SIZE / 2 + 1.5, mats.stone);
    addCube(-SIZE / 2 - 1.5, 0.5, i, mats.stone);
    addCube(SIZE / 2 + 1.5, 0.5, i, mats.stone);
  }

  for (let i = 0; i < 8; i++) {
    const cloud = new THREE.Group();
    const bits = 4 + ((Math.random() * 4) | 0);
    for (let b = 0; b < bits; b++) {
      const p = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: 0xffffff }));
      p.position.set((Math.random() - 0.5) * 4, (Math.random() - 0.3) * 1.2, (Math.random() - 0.5) * 2);
      p.scale.set(1.6, 0.8, 1.4);
      cloud.add(p);
    }
    cloud.position.set((Math.random() - 0.5) * 50, 16 + Math.random() * 6, (Math.random() - 0.5) * 50);
    scene.add(cloud);
  }

  const cells = [];
  const cellMeshes = [];
  let minesLeft = MINES;
  let flags = 0;
  let revealedCount = 0;
  let started = false;
  let over = false;
  let seconds = 0;
  let lastTick = 0;

  function idx(x, z) { return z * SIZE + x; }
  function inb(x, z) { return x >= 0 && z >= 0 && x < SIZE && z < SIZE; }

  function neighbors(x, z) {
    const out = [];
    for (let dz = -1; dz <= 1; dz++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dz) continue;
        const nx = x + dx, nz = z + dz;
        if (inb(nx, nz)) out.push(cells[idx(nx, nz)]);
      }
    }
    return out;
  }

  function worldPos(x, z) {
    return {
      x: fieldOriginX + x * BLOCK,
      z: fieldOriginZ + z * BLOCK
    };
  }

  function placeMines(safeX, safeZ) {
    let placed = 0;
    while (placed < MINES) {
      const x = (Math.random() * SIZE) | 0;
      const z = (Math.random() * SIZE) | 0;
      if (Math.abs(x - safeX) <= 1 && Math.abs(z - safeZ) <= 1) continue;
      const c = cells[idx(x, z)];
      if (c.mine) continue;
      c.mine = true;
      placed++;
    }
    cells.forEach((c) => {
      c.around = neighbors(c.x, c.z).filter((n) => n.mine).length;
    });
  }

  function buildField() {
    cells.length = 0;
    cellMeshes.forEach((m) => scene.remove(m));
    cellMeshes.length = 0;
    for (let z = 0; z < SIZE; z++) {
      for (let x = 0; x < SIZE; x++) {
        const p = worldPos(x, z);
        const mesh = addCube(p.x, 0.5, p.z, mats.grass);
        mesh.userData.cell = true;
        mesh.userData.x = x;
        mesh.userData.z = z;
        const dirt = addCube(p.x, -0.5, p.z, mats.dirt);
        dirt.userData.decor = true;
        cellMeshes.push(mesh, dirt);
        cells.push({
          x, z, mine: false, around: 0, open: false, flag: false,
          mesh, flagMesh: null, numberMesh: null
        });
      }
    }
  }

  function setFlag(cell, on) {
    if (cell.flagMesh) {
      scene.remove(cell.flagMesh);
      cell.flagMesh = null;
    }
    cell.flag = on;
    if (on) {
      const p = worldPos(cell.x, cell.z);
      const flag = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.08), mats.flag);
      flag.position.set(p.x, 1.25, p.z);
      flag.userData.ignorePick = true;
      scene.add(flag);
      cell.flagMesh = flag;
    }
  }

  function showNumber(cell) {
    const p = worldPos(cell.x, cell.z);
    const n = cell.around;
    const mesh = new THREE.Mesh(thinGeo, new THREE.MeshLambertMaterial({ map: numberTex(n) }));
    mesh.position.set(p.x, 0.09, p.z);
    mesh.receiveShadow = true;
    mesh.userData.ignorePick = true;
    scene.add(mesh);
    cell.numberMesh = mesh;
    cellMeshes.push(mesh);
  }

  function reveal(cell) {
    if (cell.open || cell.flag) return;
    cell.open = true;
    revealedCount++;
    scene.remove(cell.mesh);
    if (cell.mine) {
      const p = worldPos(cell.x, cell.z);
      const tnt = addCube(p.x, 0.5, p.z, mats.tnt);
      cellMeshes.push(tnt);
      boom(p.x, 0.8, p.z);
      lose();
      return;
    }
    showNumber(cell);
    if (cell.around === 0) {
      neighbors(cell.x, cell.z).forEach(reveal);
    }
    checkWin();
  }

  function boom(x, y, z) {
    for (let i = 0; i < 28; i++) {
      const bit = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.18, 0.18),
        new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0xc43a2b : 0xffc107 })
      );
      bit.position.set(x, y, z);
      bit.userData.vx = (Math.random() - 0.5) * 8;
      bit.userData.vy = 4 + Math.random() * 6;
      bit.userData.vz = (Math.random() - 0.5) * 8;
      bit.userData.life = 1.2;
      scene.add(bit);
      particles.push(bit);
    }
  }

  const particles = [];

  function checkWin() {
    if (revealedCount === SIZE * SIZE - MINES) {
      over = true;
      document.exitPointerLock();
      overlay.classList.remove("hidden");
      overlayTitle.textContent = "클리어!";
      overlayText.textContent = seconds + "초 만에 모든 안전한 블록을 찾았습니다.";
      startBtn.textContent = "다시 하기";
    }
  }

  function lose() {
    over = true;
    cells.forEach((c) => {
      if (c.mine && !c.open) {
        scene.remove(c.mesh);
        const p = worldPos(c.x, c.z);
        cellMeshes.push(addCube(p.x, 0.5, p.z, mats.tnt));
      }
    });
    document.exitPointerLock();
    overlay.classList.remove("hidden");
    overlayTitle.textContent = "펑!";
    overlayText.textContent = "TNT를 건드렸습니다. 다시 탐험해 보세요.";
    startBtn.textContent = "다시 하기";
  }

  function resetGame() {
    particles.splice(0).forEach((p) => scene.remove(p));
    cells.forEach((c) => {
      if (c.flagMesh) scene.remove(c.flagMesh);
      if (c.numberMesh) scene.remove(c.numberMesh);
    });
    buildField();
    minesLeft = MINES;
    flags = 0;
    revealedCount = 0;
    started = false;
    over = false;
    seconds = 0;
    lastTick = 0;
    mineEl.textContent = MINES;
    flagEl.textContent = "0";
    timerEl.textContent = "0";
    player.x = 0;
    player.z = SIZE / 2 + 4;
    player.y = EYE;
    player.vy = 0;
    yaw = 0;
    pitch = -0.18;
  }

  const keys = Object.create(null);
  const player = { x: 0, y: EYE, z: SIZE / 2 + 4, vy: 0, onGround: true };
  let yaw = 0;
  let pitch = -0.18;
  let locked = false;

  addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "Space") e.preventDefault();
  });
  addEventListener("keyup", (e) => { keys[e.code] = false; });

  addEventListener("mousemove", (e) => {
    if (!locked) return;
    yaw -= e.movementX * 0.0024;
    pitch -= e.movementY * 0.0024;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
  });

  renderer.domElement.addEventListener("click", () => {
    if (overlay.classList.contains("hidden") && !locked) {
      renderer.domElement.requestPointerLock();
    }
  });

  document.addEventListener("pointerlockchange", () => {
    locked = document.pointerLockElement === renderer.domElement;
  });

  function pickCell() {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hits = raycaster.intersectObjects(scene.children, false);
    for (const h of hits) {
      if (h.object.userData.ignorePick || h.object.userData.decor) continue;
      if (h.object.userData.cell && h.distance < 5.2) {
        return cells[idx(h.object.userData.x, h.object.userData.z)];
      }
    }
    return null;
  }

  const raycaster = new THREE.Raycaster();

  addEventListener("mousedown", (e) => {
    if (!locked || over) return;
    const cell = pickCell();
    if (!cell || cell.open) return;
    if (e.button === 0) {
      if (!started) {
        placeMines(cell.x, cell.z);
        started = true;
        lastTick = performance.now();
      }
      if (!cell.flag) reveal(cell);
    } else if (e.button === 2) {
      if (!started) return;
      setFlag(cell, !cell.flag);
      flags = cells.filter((c) => c.flag).length;
      flagEl.textContent = String(flags);
      mineEl.textContent = String(MINES - flags);
    }
  });
  addEventListener("contextmenu", (e) => e.preventDefault());

  function collide(nx, nz) {
    const half = SIZE / 2 + 1.15;
    nx = Math.max(-38, Math.min(38, nx));
    nz = Math.max(-38, Math.min(38, nz));
    const minX = -half, maxX = half, minZ = -half, maxZ = half;
    const insideField = nx > minX && nx < maxX && nz > minZ && nz < maxZ;
    if (insideField) return { x: nx, z: nz };
    return { x: nx, z: nz };
  }

  let prev = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - prev) / 1000);
    prev = now;

    if (started && !over) {
      if (now - lastTick >= 1000) {
        seconds += Math.floor((now - lastTick) / 1000);
        lastTick += Math.floor((now - lastTick) / 1000) * 1000;
        timerEl.textContent = String(seconds);
      }
    }

    if (locked && !over) {
      const forward = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
      const strafe = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      const sin = Math.sin(yaw);
      const cos = Math.cos(yaw);
      let vx = (-forward * sin + strafe * cos) * SPEED;
      let vz = (-forward * cos - strafe * sin) * SPEED;
      if (forward && strafe) {
        vx *= 0.707;
        vz *= 0.707;
      }
      const next = collide(player.x + vx * dt, player.z + vz * dt);
      player.x = next.x;
      player.z = next.z;
      if (keys.Space && player.onGround) {
        player.vy = JUMP;
        player.onGround = false;
      }
    }

    player.vy -= GRAVITY * dt;
    player.y += player.vy * dt;
    if (player.y <= EYE) {
      player.y = EYE;
      player.vy = 0;
      player.onGround = true;
    }

    camera.position.set(player.x, player.y, player.z);
    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.userData.life -= dt;
      p.position.x += p.userData.vx * dt;
      p.position.y += p.userData.vy * dt;
      p.position.z += p.userData.vz * dt;
      p.userData.vy -= 16 * dt;
      p.rotation.x += dt * 4;
      if (p.userData.life <= 0) {
        scene.remove(p);
        particles.splice(i, 1);
      }
    }

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  startBtn.addEventListener("click", () => {
    resetGame();
    overlay.classList.add("hidden");
    renderer.domElement.requestPointerLock();
  });

  resetGame();
  requestAnimationFrame(loop);
})();
  </script>
</body>
