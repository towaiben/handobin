<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스트릿 파이터</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0a12;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #fff;
      user-select: none;
    }
    #wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: min(96vw, calc(96vh * 16 / 9));
      height: min(96vh, calc(96vw * 9 / 16));
      background: #4aa3e0;
      box-shadow: 0 0 0 4px #1a1a22, 0 12px 40px rgba(0, 0, 0, 0.55);
    }
    #help {
      font-size: 14px;
      color: #c8c8d0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540" tabindex="0"></canvas>
    <div id="help">← → 이동 · ↑ 점프 · ↓ 가드 · A/Z 약공 · S/X 강공 · D/C 필살기 · Enter 결정</div>
  </div>
  <script>
(function () {
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  var W = 960, H = 540;
  var GROUND = 456;
  var keys = {};
  var prevKeys = {};
  var mode = "title";
  var tick = 0;
  var selected = 0;
  var cpuPick = 1;
  var pickPhase = "player";
  var player, cpu, fx, camera;
  var timeLeft = 99;
  var timeAcc = 0;
  var winner = "";
  var flash = 0;

  var FIGHTERS = [
    { id: "hyo", name: "효우검", title: "빙결의 검사", hair: "#f4f4f8", skin: "#f0c8a8", gi: "#1a1a22", accent: "#d8e8f8", cloak: "#f0f4fa", fx: "#9ad8ff", special: "빙천일섬" },
    { id: "akamen", name: "적면", title: "가면의 귀객", hair: "#2a2018", skin: "#e8b898", gi: "#2a1a14", accent: "#c81c1c", cloak: "#f2efe8", fx: "#ff4d6d", special: "혈월참" },
    { id: "rae", name: "뇌영", title: "번개 닌자", hair: "#f2d24a", skin: "#f0c4a0", gi: "#1c3a28", accent: "#f6e05e", cloak: "#f7c948", fx: "#ffe566", special: "뇌신일격" },
    { id: "sakura", name: "벚꽃", title: "화염 무희", hair: "#f2a0c0", skin: "#f6d0b8", gi: "#c43c6a", accent: "#fff0f5", cloak: "#ffd6e8", fx: "#ff7ab8", special: "만개난무" },
    { id: "kuro", name: "흑염", title: "암흑 권사", hair: "#1a1218", skin: "#c89878", gi: "#121018", accent: "#6a2ad8", cloak: "#2a1840", fx: "#b46cff", special: "암흑폭염" },
    { id: "mizu", name: "청파", title: "파도의 수도승", hair: "#1a3a58", skin: "#e8c0a0", gi: "#1a4a68", accent: "#7ad0f0", cloak: "#d8f0ff", fx: "#4ec8ff", special: "대해참파" },
    { id: "suna", name: "사왕", title: "사막의 수호자", hair: "#c45a2a", skin: "#e0b088", gi: "#6a3a18", accent: "#e8c060", cloak: "#c8a050", fx: "#e0b040", special: "열사폭풍" },
    { id: "eun", name: "은월", title: "달빛의 치유사", hair: "#f8f0d8", skin: "#f4d0bc", gi: "#f4e8f0", accent: "#d0a0e0", cloak: "#ffffff", fx: "#e8c8ff", special: "월하섬광" }
  ];

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function irand(a, b) { return (a + Math.floor(Math.random() * (b - a + 1))); }
  function held(code) { return !!keys[code]; }
  function pressed(code) { return !!keys[code] && !prevKeys[code]; }
  function anyHeld(list) {
    for (var i = 0; i < list.length; i++) if (held(list[i])) return true;
    return false;
  }
  function anyPressed(list) {
    for (var i = 0; i < list.length; i++) if (pressed(list[i])) return true;
    return false;
  }

  window.addEventListener("keydown", function (e) {
    keys[e.code] = true;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].indexOf(e.code) >= 0) e.preventDefault();
    if (mode === "title" && (e.code === "Enter" || e.code === "KeyZ" || e.code === "KeyA")) {
      mode = "select";
      pickPhase = "player";
    } else if (mode === "select") {
      var cols = 4;
      if (e.code === "ArrowLeft") selected = (selected + FIGHTERS.length - 1) % FIGHTERS.length;
      if (e.code === "ArrowRight") selected = (selected + 1) % FIGHTERS.length;
      if (e.code === "ArrowUp") selected = (selected + FIGHTERS.length - cols) % FIGHTERS.length;
      if (e.code === "ArrowDown") selected = (selected + cols) % FIGHTERS.length;
      if (e.code === "Enter" || e.code === "Space") confirmPick();
    } else if ((mode === "win" || mode === "lose") && (e.code === "Enter" || e.code === "Space")) {
      mode = "select";
      pickPhase = "player";
    }
  });
  window.addEventListener("keyup", function (e) { keys[e.code] = false; });
  canvas.addEventListener("click", function () {
    canvas.focus();
    if (mode === "title") { mode = "select"; pickPhase = "player"; }
  });

  function confirmPick() {
    if (pickPhase === "player") {
      cpuPick = (selected + 1 + irand(0, FIGHTERS.length - 2)) % FIGHTERS.length;
      pickPhase = "cpu";
      setTimeout(function () {
        startFight(selected, cpuPick);
      }, 500);
    }
  }

  function makeFighter(def, x, facing, isCpu) {
    return {
      def: def, x: x, y: GROUND, vx: 0, vy: 0,
      facing: facing, hp: 100, maxHp: 100, meter: 30, stocks: 1,
      state: "idle", frame: 0, stun: 0, hits: 0,
      comboTimer: 0, airborne: false, crouch: false, blocking: false,
      attack: null, dead: false, isCpu: isCpu, ai: { t: 0, act: "chase" },
      chip: 0
    };
  }

  function startFight(pi, ci) {
    player = makeFighter(FIGHTERS[pi], 280, 1, false);
    cpu = makeFighter(FIGHTERS[ci], 680, -1, true);
    fx = [];
    camera = { x: 0, shake: 0 };
    timeLeft = 99;
    timeAcc = 0;
    winner = "";
    flash = 0;
    mode = "fight";
    canvas.focus();
  }

  function addFx(kind, x, y, color, life, extra) {
    extra = extra || {};
    fx.push({ kind: kind, x: x, y: y, color: color, life: life, max: life, vx: extra.vx || 0, vy: extra.vy || 0, s: extra.s || 1 });
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      addFx("spark", x, y, color, irand(12, 26), {
        vx: rand(-4, 4), vy: rand(-5, 0.6), s: rand(2, 4)
      });
    }
  }

  function busy(f) {
    return f.state === "attack" || f.state === "special";
  }

  function hitbox(f) {
    var w = f.crouch ? 36 : 32;
    var h = f.crouch ? 48 : 78;
    return { x: f.x - w / 2, y: f.y - h, w: w, h: h };
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function startAttack(f, kind) {
    if (f.stun > 0 || f.dead || busy(f)) return false;
    if (kind === "special") {
      if (f.stocks < 1 && f.meter < 100) return false;
      if (f.stocks >= 1) f.stocks -= 1;
      else f.meter = 0;
      f.state = "special";
      f.frame = 0;
      f.attack = { kind: "special", dmg: 22, stun: 18, kb: 6, start: 6, active: 14, rec: 16, hit: false };
      f.vx = f.facing * 2.2;
      flash = 8;
      camera.shake = 8;
      return true;
    }
    var light = kind === "light";
    f.state = "attack";
    f.frame = 0;
    f.attack = light
      ? { kind: "light", dmg: 8, stun: 12, kb: 2.4, start: 3, active: 8, rec: 6, hit: false }
      : { kind: "heavy", dmg: 14, stun: 16, kb: 4, start: 6, active: 8, rec: 10, hit: false };
    f.vx = f.facing * (light ? 1.6 : 2.4);
    return true;
  }

  function attackBox(f) {
    if (!f.attack) return null;
    var a = f.attack;
    if (f.frame < a.start || f.frame >= a.start + a.active) return null;
    var w = a.kind === "special" ? 88 : a.kind === "heavy" ? 56 : 48;
    var h = a.kind === "special" ? 80 : 40;
    var x = f.facing > 0 ? f.x + 10 : f.x - 10 - w;
    return { x: x, y: f.y - (a.kind === "special" ? 86 : 58), w: w, h: h };
  }

  function applyHit(atk, def, box) {
    if (!atk.attack || def.dead || atk.attack.hit) return;
    var facingAtk = def.x >= atk.x ? 1 : -1;
    if (def.blocking && !def.airborne && def.facing !== facingAtk) {
      def.hp = Math.max(1, def.hp - atk.attack.dmg * 0.08);
      def.stun = 8;
      def.vx = facingAtk * 1.2;
      atk.attack.hit = true;
      addFx("spark", box.x + box.w / 2, box.y + 10, "#cce8ff", 10);
      return;
    }
    atk.attack.hit = true;
    def.hp = Math.max(0, def.hp - atk.attack.dmg);
    def.chip = 12;
    def.state = "hurt";
    def.frame = 0;
    def.stun = atk.attack.stun;
    def.attack = null;
    def.vx = facingAtk * atk.attack.kb;
    def.vy = atk.attack.kind === "special" ? -5.2 : -2.2;
    def.airborne = true;
    atk.hits += 1;
    atk.comboTimer = 50;
    atk.meter = Math.min(100, atk.meter + (atk.attack.kind === "light" ? 14 : 20));
    if (atk.meter >= 100 && atk.stocks < 3) { atk.stocks += 1; atk.meter = 0; }
    camera.shake = atk.attack.kind === "special" ? 10 : 4;
    burst(def.x, def.y - 44, atk.def.fx, atk.attack.kind === "special" ? 22 : 10);
    if (atk.attack.kind === "special") addFx("boom", def.x, def.y - 48, atk.def.fx, 18, { s: 2.2 });
    if (def.hp <= 0) {
      def.dead = true;
      def.state = "ko";
      def.vy = -6;
      winner = atk.isCpu ? "cpu" : "player";
    }
  }

  function updateFighter(f, opp, input) {
    f.frame += 1;
    if (f.comboTimer > 0) f.comboTimer -= 1;
    else f.hits = 0;
    if (f.chip > 0) f.chip -= 1;
    if (f.dead) {
      f.vy += 0.42;
      f.y += f.vy;
      f.x += f.vx;
      if (f.y >= GROUND) { f.y = GROUND; f.vy = 0; f.vx *= 0.8; }
      return;
    }
    if (f.stun > 0) {
      f.stun -= 1;
      f.vy += 0.42;
      f.x += f.vx;
      f.y += f.vy;
      f.vx *= 0.9;
      if (f.y >= GROUND) { f.y = GROUND; f.vy = 0; f.airborne = false; }
      if (f.stun <= 0 && f.state === "hurt") { f.state = "idle"; f.frame = 0; }
      return;
    }

    if (!busy(f)) f.facing = opp.x >= f.x ? 1 : -1;
    f.blocking = false;
    f.crouch = false;

    if (busy(f) && f.attack) {
      var box = attackBox(f);
      if (box && overlap(box, hitbox(opp))) applyHit(f, opp, box);
      if (f.state === "special" && f.frame === 8) {
        burst(f.x + f.facing * 50, f.y - 48, f.def.fx, 16);
        addFx("boom", f.x + f.facing * 56, f.y - 52, f.def.fx, 16, { s: 2.4 });
      }
      var end = f.attack.start + f.attack.active + f.attack.rec;
      if (f.frame >= end) { f.state = "idle"; f.attack = null; f.frame = 0; }
      f.vy += 0.42;
      f.y += f.vy;
      f.x += f.vx;
      f.vx *= 0.86;
      if (f.y >= GROUND) { f.y = GROUND; f.vy = 0; f.airborne = false; }
      f.x = clamp(f.x, 50, W - 50);
      return;
    }

    if (input.special && startAttack(f, "special")) return;
    if (input.heavy && startAttack(f, "heavy")) return;
    if (input.light && startAttack(f, "light")) return;

    if (input.down && !f.airborne) {
      f.crouch = true;
      f.blocking = true;
      f.vx *= 0.55;
    } else {
      if (input.left) f.vx = -3.1;
      else if (input.right) f.vx = 3.1;
      else f.vx *= 0.72;
      if (input.jump && !f.airborne) { f.vy = -8.2; f.airborne = true; }
    }

    f.vy += 0.42;
    f.x += f.vx;
    f.y += f.vy;
    if (f.y >= GROUND) { f.y = GROUND; f.vy = 0; f.airborne = false; }
    f.x = clamp(f.x, 50, W - 50);
    if (Math.abs(f.vx) > 0.5 && !f.crouch && !f.airborne) f.state = "walk";
    else if (f.airborne) f.state = "jump";
    else if (f.crouch) f.state = "block";
    else f.state = "idle";
  }

  function cpuInput() {
    var a = cpu.ai;
    a.t -= 1;
    if (a.t <= 0) {
      var dist = Math.abs(cpu.x - player.x);
      var r = Math.random();
      if (player.state === "attack" && r < 0.28) a.act = "block";
      else if ((cpu.stocks >= 1 || cpu.meter >= 100) && dist < 140 && r < 0.22) a.act = "special";
      else if (dist > 90) a.act = "chase";
      else if (r < 0.4) a.act = "light";
      else if (r < 0.62) a.act = "heavy";
      else if (r < 0.75) a.act = "jump";
      else a.act = "chase";
      a.t = irand(10, 22);
    }
    var left = false, right = false, jump = false, down = false, light = false, heavy = false, special = false;
    if (a.act === "chase") {
      if (player.x < cpu.x - 48) left = true;
      if (player.x > cpu.x + 48) right = true;
    } else if (a.act === "block") down = true;
    else if (a.act === "jump") jump = true;
    else if (a.act === "light") light = true;
    else if (a.act === "heavy") heavy = true;
    else if (a.act === "special") special = true;
    return { left: left, right: right, jump: jump, down: down, light: light, heavy: heavy, special: special };
  }

  function playerInput() {
    return {
      left: anyHeld(["ArrowLeft", "KeyQ"]),
      right: anyHeld(["ArrowRight"]),
      jump: anyHeld(["ArrowUp"]),
      down: anyHeld(["ArrowDown"]),
      light: anyPressed(["KeyZ", "KeyA", "KeyJ"]),
      heavy: anyPressed(["KeyX", "KeyS", "KeyK"]),
      special: anyPressed(["KeyC", "KeyD", "KeyL"])
    };
  }

  function updateFight() {
    tick += 1;
    timeAcc += 1;
    if (timeAcc >= 60 && timeLeft > 0 && !winner) {
      timeAcc = 0;
      timeLeft -= 1;
      if (timeLeft <= 0) {
        winner = player.hp >= cpu.hp ? "player" : "cpu";
        if (player.hp === cpu.hp) winner = "draw";
      }
    }
    if (flash > 0) flash -= 1;
    if (camera.shake > 0) camera.shake *= 0.82;
    updateFighter(player, cpu, playerInput());
    updateFighter(cpu, player, cpuInput());
    if (Math.abs(player.x - cpu.x) < 34 && player.y >= GROUND - 4 && cpu.y >= GROUND - 4 && !busy(player) && !busy(cpu)) {
      var mid = (player.x + cpu.x) / 2;
      if (player.x < cpu.x) { player.x = mid - 18; cpu.x = mid + 18; }
      else { player.x = mid + 18; cpu.x = mid - 18; }
    }
    for (var i = fx.length - 1; i >= 0; i--) {
      var p = fx[i];
      p.life -= 1;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      if (p.life <= 0) fx.splice(i, 1);
    }
    if (winner) {
      updateFight.endT = (updateFight.endT || 0) + 1;
      if (updateFight.endT > 90) {
        mode = winner === "player" ? "win" : "lose";
        updateFight.endT = 0;
      }
    } else updateFight.endT = 0;

    var code;
    prevKeys = {};
    for (code in keys) prevKeys[code] = keys[code];
  }

  function rect(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  function drawVillage() {
    rect(0, 0, W, H, "#5eb6ea");
    ctx.fillStyle = "#dff4ff";
    for (var i = 0; i < 6; i++) {
      var cx = (i * 210 + tick * 0.25) % (W + 140) - 70;
      ctx.beginPath();
      ctx.ellipse(cx, 56 + (i % 3) * 14, 52, 16, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    rect(0, 336, W, 80, "#c9b48a");
    rect(0, 376, W, 164, "#d8c49a");
    rect(0, 456, W, 84, "#c4a874");
    for (var g = 0; g < W; g += 10) rect(g, 456, 5, 3, "#b89860");

    drawHouse(36, 336, 184, 124);
    drawHouse(264, 316, 216, 144);
    drawHouse(536, 328, 192, 132);
    drawHouse(780, 340, 160, 116);
    drawTree(472, 452);
    drawTree(140, 456);
    rect(80, 312, 12, 8, "#222");
    rect(84, 304, 8, 8, "#111");
  }

  function drawHouse(x, y, w, h) {
    rect(x, y - h + 44, w, h - 44, "#c9a06a");
    rect(x + 8, y - h + 56, w - 16, h - 64, "#b88952");
    ctx.fillStyle = "#6a5a4a";
    ctx.beginPath();
    ctx.moveTo(x - 16, y - h + 52);
    ctx.lineTo(x + w / 2, y - h - 12);
    ctx.lineTo(x + w + 16, y - h + 52);
    ctx.closePath();
    ctx.fill();
    rect(x - 12, y - h + 44, w + 24, 12, "#5a4a3c");
    rect(x + 20, y - 56, 28, 36, "#3a2a1c");
    rect(x + w - 56, y - h + 80, 32, 24, "#e8d8b0");
    rect(x + w - 40, y - h + 88, 8, 8, "#6a8aaa");
    rect(x + 44, y - h + 80, 32, 24, "#e8d8b0");
  }

  function drawTree(x, y) {
    rect(x - 4, y - 44, 10, 44, "#6a3e1c");
    ctx.fillStyle = "#2f8a3a";
    ctx.beginPath();
    ctx.ellipse(x, y - 56, 32, 28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#24702e";
    ctx.beginPath();
    ctx.ellipse(x - 16, y - 44, 20, 16, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFighter(f) {
    var x = f.x, y = f.y;
    var d = f.def;
    var bob = (f.state === "walk") ? Math.round(Math.sin(f.frame * 0.4) * 2) : 0;
    var punch = 0;
    if (f.state === "attack" && f.attack) {
      punch = f.frame >= f.attack.start && f.frame < f.attack.start + f.attack.active ? 22 : 8;
    }
    if (f.state === "special") punch = 28;
    var squat = f.crouch ? 18 : 0;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y + bob));
    ctx.scale(f.facing, 1);

    rect(-10, -20 + squat, 8, 20, "#1a1520");
    rect(4, -20 + squat, 8, 20, "#1a1520");
    rect(-8, -16 + squat, 8, 6, "#3a2a20");
    rect(6, -16 + squat, 8, 6, "#3a2a20");
    rect(-18, -52 + squat, 36, 36, d.gi);
    rect(-20, -40 + squat, 40, 10, d.cloak);
    rect(-22, -48 + squat, 12, 24, d.gi);
    rect(12, -48 + squat, 12, 24, d.gi);
    rect(-16, -80 + squat, 32, 30, d.skin);
    rect(-18, -92 + squat, 36, 20, d.hair);
    rect(-20, -84 + squat, 12, 24, d.hair);
    rect(8, -88 + squat, 14, 20, d.hair);
    if (d.id === "akamen") {
      rect(-16, -80 + squat, 32, 18, "#f4efe6");
      rect(-10, -74 + squat, 8, 6, "#c81c1c");
      rect(4, -74 + squat, 8, 6, "#c81c1c");
      rect(-4, -66 + squat, 10, 4, "#8a1010");
    } else {
      rect(-8, -70 + squat, 4, 4, "#221810");
      rect(4, -70 + squat, 4, 4, "#221810");
    }
    rect(16 + punch, -44 + squat, 28, 6, d.accent);
    rect(36 + punch, -48 + squat, 6, 14, d.accent);
    if (f.state === "special") {
      rect(28, -72, 28, 28, d.fx);
      rect(36, -80, 16, 16, "#ffffff");
    }
    if (f.blocking) rect(20, -64 + squat, 6, 40, d.accent);
    ctx.restore();
    if (f.state === "hurt") {
      ctx.globalAlpha = 0.28;
      rect(x - 24, y - 96, 48, 96, "#ff5555");
      ctx.globalAlpha = 1;
    }
  }

  function drawPortrait(x, y, def, r, flip) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = "#1a120c";
    ctx.fill();
    ctx.clip();
    ctx.translate(x, y + 10);
    if (flip) ctx.scale(-1, 1);
    var s = r / 16;
    rect(-10 * s, -4 * s, 20 * s, 16 * s, def.gi);
    rect(-8 * s, -16 * s, 16 * s, 14 * s, def.skin);
    rect(-10 * s, -22 * s, 20 * s, 10 * s, def.hair);
    if (def.id === "akamen") {
      rect(-8 * s, -16 * s, 16 * s, 8 * s, "#f2efe8");
      rect(-5 * s, -13 * s, 4 * s, 3 * s, "#c81c1c");
      rect(2 * s, -13 * s, 4 * s, 3 * s, "#c81c1c");
    }
    ctx.restore();
    ctx.strokeStyle = "#f0e6c8";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawBar(x, y, w, h, t, fromLeft, fill, back) {
    rect(x, y, w, h, back);
    var fw = Math.round(w * clamp(t, 0, 1));
    if (fromLeft) rect(x, y, fw, h, fill);
    else rect(x + w - fw, y, fw, h, fill);
    ctx.strokeStyle = "#2a2010";
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function drawHud() {
    drawPortrait(44, 44, player.def, 32, false);
    drawPortrait(W - 44, 44, cpu.def, 32, true);
    drawBar(84, 20, 300, 22, player.hp / player.maxHp, true, "#f0b020", "#5a2010");
    drawBar(W - 384, 20, 300, 22, cpu.hp / cpu.maxHp, false, "#f0b020", "#5a2010");
    rect(W / 2 - 32, 12, 64, 40, "#2a2a33");
    ctx.fillStyle = "#e8e8f0";
    ctx.font = "bold 30px monospace";
    ctx.textAlign = "center";
    ctx.fillText(("0" + timeLeft).slice(-2), W / 2, 42);

    if (player.hits >= 2) {
      ctx.textAlign = "left";
      ctx.fillStyle = "#ff3b3b";
      ctx.font = "italic bold 22px sans-serif";
      ctx.fillText("RUSH", 84, 72);
      ctx.fillStyle = "#ff9a1e";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText(player.hits + " HITS", 84, 98);
    }

    drawPortrait(36, H - 36, player.def, 20, false);
    drawPortrait(W - 36, H - 36, cpu.def, 20, true);
    drawBar(64, H - 32, 180, 14, player.meter / 100, true, "#3aa0ff", "#102038");
    drawBar(W - 244, H - 32, 180, 14, cpu.meter / 100, false, "#3aa0ff", "#102038");
    ctx.fillStyle = "#dff0ff";
    ctx.font = "bold 18px monospace";
    ctx.textAlign = "left";
    ctx.fillText(String(player.stocks), 64, H - 40);
    ctx.textAlign = "right";
    ctx.fillText(String(cpu.stocks), W - 64, H - 40);
    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText(player.def.name, 84, 68);
    ctx.textAlign = "right";
    ctx.fillText(cpu.def.name, W - 84, 68);
  }

  function drawFx() {
    fx.forEach(function (p) {
      var a = p.life / p.max;
      ctx.globalAlpha = a;
      if (p.kind === "boom") {
        ctx.fillStyle = p.color;
        var s = (1 - a) * 48 * p.s;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, s * 0.45, 0, Math.PI * 2);
        ctx.fill();
      } else {
        rect(p.x, p.y, p.s * 3, p.s * 3, p.color);
      }
      ctx.globalAlpha = 1;
    });
  }

  function drawTitle() {
    drawVillage();
    ctx.fillStyle = "rgba(10,10,20,0.35)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff6d8";
    ctx.font = "bold 56px sans-serif";
    ctx.fillText("스트릿 파이터", W / 2, 190);
    ctx.font = "22px sans-serif";
    ctx.fillStyle = "#ffe8a0";
    ctx.fillText("스트리트 파이터 스타일 · CPU 대전", W / 2, 232);
    ctx.fillStyle = tick % 50 < 30 ? "#fff" : "#bbb";
    ctx.font = "26px sans-serif";
    ctx.fillText("클릭 또는 Enter 로 시작", W / 2, 340);
  }

  function drawSelect() {
    drawVillage();
    ctx.fillStyle = "rgba(8,10,20,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff6d8";
    ctx.font = "bold 28px sans-serif";
    ctx.fillText(pickPhase === "player" ? "당신의 캐릭터를 고르세요" : "CPU 상대 선택 중...", W / 2, 44);
    var i;
    for (i = 0; i < FIGHTERS.length; i++) {
      var col = i % 4, row = Math.floor(i / 4);
      var x = 88 + col * 210, y = 80 + row * 190;
      var on = i === selected;
      rect(x - 8, y - 8, 176, 168, on ? "#f0c040" : "#2a2430");
      rect(x, y, 160, 152, "#1a1620");
      drawPortrait(x + 80, y + 56, FIGHTERS[i], 36, false);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(FIGHTERS[i].name, x + 80, y + 112);
      ctx.fillStyle = FIGHTERS[i].fx;
      ctx.font = "16px sans-serif";
      ctx.fillText(FIGHTERS[i].title, x + 80, y + 136);
    }
    var cur = FIGHTERS[selected];
    ctx.fillStyle = "#fff";
    ctx.font = "20px sans-serif";
    ctx.fillText("필살기: " + cur.special, W / 2, H - 20);
  }

  function drawResult(ok) {
    drawVillage();
    if (player) drawFighter(player);
    if (cpu) drawFighter(cpu);
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = ok ? "#ffe566" : "#ff8080";
    ctx.font = "bold 56px sans-serif";
    ctx.fillText(winner === "draw" ? "무승부" : (ok ? "승리!" : "패배"), W / 2, 240);
    ctx.fillStyle = "#fff";
    ctx.font = "24px sans-serif";
    ctx.fillText("Enter 로 다시 선택", W / 2, 300);
  }

  function drawFight() {
    var sx = (Math.random() - 0.5) * camera.shake;
    var sy = (Math.random() - 0.5) * camera.shake;
    ctx.save();
    ctx.translate(sx, sy);
    drawVillage();
    drawFighter(cpu);
    drawFighter(player);
    drawFx();
    ctx.restore();
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + (flash / 16) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    drawHud();
  }

  function loop() {
    if (mode === "fight") updateFight();
    else tick += 1;
    ctx.clearRect(0, 0, W, H);
    if (mode === "title") drawTitle();
    else if (mode === "select") drawSelect();
    else if (mode === "win") drawResult(true);
    else if (mode === "lose") drawResult(false);
    else drawFight();
    if (mode !== "fight") {
      var code;
      prevKeys = {};
      for (code in keys) prevKeys[code] = keys[code];
    }
    requestAnimationFrame(loop);
  }

  canvas.addEventListener("mousedown", function (e) {
    if (mode !== "select" || pickPhase !== "player") return;
    var r = canvas.getBoundingClientRect();
    var mx = (e.clientX - r.left) * (W / r.width);
    var my = (e.clientY - r.top) * (H / r.height);
    for (var i = 0; i < FIGHTERS.length; i++) {
      var col = i % 4, row = Math.floor(i / 4);
      var x = 88 + col * 210, y = 80 + row * 190;
      if (mx >= x && mx <= x + 160 && my >= y && my <= y + 152) {
        selected = i;
        confirmPick();
        break;
      }
    }
  });

  loop();
})();
  </script>
</body>
</html>
