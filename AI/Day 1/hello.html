<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>안녕하세요</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      background: #121212;
      font-family: sans-serif;
    }
    h1 {
      width: 70vw;
      margin: 0;
      font-size: min(12vw, 25vh);
      font-weight: 700;
      color: #f5f5f5;
      text-align: center;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
    }
    button {
      padding: 1.2rem 3rem;
      border: none;
      border-radius: 12px;
      background: #f5f5f5;
      color: #121212;
      font-size: 2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <h1>안녕하세요, 현대코퍼레이션!</h1>
  <button type="button" id="color-btn">색 바꾸기</button>
  <script>
    document.getElementById("color-btn").addEventListener("click", function () {
      var r = Math.floor(Math.random() * 256);
      var g = Math.floor(Math.random() * 256);
      var b = Math.floor(Math.random() * 256);
      document.body.style.background = "rgb(" + r + ", " + g + ", " + b + ")";
    });
  </script>
</body>
</html>
